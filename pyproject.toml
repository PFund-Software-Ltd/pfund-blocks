[project]
name = "pfund-blocks"
version = "0.0.2"
description = "Building blocks for `pfund`"
readme = "README.md"
authors = [
    { name = "softwareentrepreneer", email = "softwareentrepreneer+pfund-blocks@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "httpx2[http2]>=2.16.0",
    "websockets>=16.1.1",
    "msgspec>=0.22.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { uv_build = false }

[tool.uv.build-backend]
module-name = "pfund_blocks"
module-root = "src"
