[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfund-blocks@gmail.com>"]
channels = ["conda-forge"]
name = "pfund-blocks"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64"]
requires-pixi = ">=0.83.0"
exclude-newer = "14d"

[pypi-exclude-newer]
uv_build = "0d"
afterpython = "0d"

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  { task = "test", environment = "py315" },
]

[dependencies]


[environments]
default = ["py313", "dev", "test", "optional"]
py313 = ["py313", "test", "optional"]
py314 = ["py314", "test", "optional"]
py315 = ["py315", "test", "optional"]

[feature.optional.pypi-dependencies]

[feature.dev.pypi-dependencies]
pfund-blocks = { path = ".", editable = true }
afterpython = ">=0.4.0"

[feature.test.pypi-dependencies]
pfund-blocks = { path = ".", editable = true }
pytest = ">=9.1.1"
pytest-cov = ">=7.1.0"
pytest-mock = ">=3.16.0"
pytest-xdist = ">=3.8.0"
[feature.test.tasks]
test = "pytest -n auto"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
