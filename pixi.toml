[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfund-blocks@gmail.com>"]
channels = ["conda-forge"]
name = "pfund-blocks"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64"]
requires-pixi = ">=0.83.0"
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0d"

[pypi-exclude-newer]
afterpython = "0d"
uv_build = "0d"

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  { task = "test", environment = "py315" },
]

[dependencies]

[pypi-dependencies]
python-dotenv = ">=1.2.4"
httpx2 = { version = ">=2.16.0", extras = ["http2"] }
websockets = ">=16.1.1"
msgspec = ">=0.22.0"
pydantic = ">=2.14.1"

[environments]
default = ["py313", "dev", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]

[feature.dev.pypi-dependencies]
pfund-blocks = { path = ".", editable = true }
afterpython = { path ="../../afterpython.org/afterpython", editable = true }  # TEMP
# afterpython = ">=0.4.0"

[feature.test.pypi-dependencies]
pfund-blocks = { path = ".", editable = true }
pytest = ">=9.1.1"
pytest-mock = ">=3.17.0"
pytest-xdist = ">=3.8.0"
[feature.test.tasks]
test = "pytest -n auto"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
